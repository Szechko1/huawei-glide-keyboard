name: Create Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0, v1.1, etc.

jobs:
  release:
    name: Create Release with APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Build debug APK
      run: ./gradlew assembleDebug

    - name: Rename APK with version
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk \
           app/build/outputs/apk/debug/huawei-glide-keyboard-${{ steps.version.outputs.version }}.apk

    - name: Generate checksums
      run: |
        cd app/build/outputs/apk/debug
        sha256sum huawei-glide-keyboard-${{ steps.version.outputs.version }}.apk > checksums.txt
        md5sum huawei-glide-keyboard-${{ steps.version.outputs.version }}.apk >> checksums.txt

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: Huawei Glide Keyboard ${{ steps.version.outputs.tag }}
        body: |
          ## 🎉 Huawei Glide Keyboard ${{ steps.version.outputs.tag }}

          Android swipe/glide keyboard with word prediction.

          ### 📱 Features
          - Glide/swipe typing across letters
          - Real-time word prediction
          - QWERTY and symbols layouts
          - Customizable settings

          ### 📥 Installation

          1. **Download** the APK file below
          2. **Transfer** to your Android device
          3. **Install** the APK (enable "Unknown Sources" if needed)
          4. **Enable keyboard**:
             - Go to: Settings → System → Languages & Input → On-screen keyboard
             - Enable "Glide Keyboard"
          5. **Select keyboard**:
             - Tap any text field
             - Tap keyboard switcher icon (⌨️)
             - Select "Glide Keyboard"

          ### ✨ How to Use

          - **Glide mode**: Slide your finger across letters to form words
          - **Tap mode**: Tap individual keys like a normal keyboard
          - **Word suggestions**: Tap suggested words above the keyboard

          ### 📊 Requirements

          - Android 5.0 (API 21) or higher
          - ~5 MB storage space

          ### 🔐 Checksums

          See `checksums.txt` for file verification.

          ### 📖 Documentation

          - [README](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/README.md)
          - [Hungarian README](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/README_HU.md)
          - [Build Guide](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/BUILD_GUIDE.md)

          ---

          **Note**: This is an unsigned debug build. For production use, sign the APK with your own key.
        files: |
          app/build/outputs/apk/debug/huawei-glide-keyboard-${{ steps.version.outputs.version }}.apk
          app/build/outputs/apk/debug/checksums.txt
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload to artifacts (backup)
      uses: actions/upload-artifact@v4
      with:
        name: release-apk-${{ steps.version.outputs.version }}
        path: app/build/outputs/apk/debug/huawei-glide-keyboard-${{ steps.version.outputs.version }}.apk
        retention-days: 90
