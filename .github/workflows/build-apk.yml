name: Build Android APK

on:
  push:
    branches: [ main, master, develop, 'claude/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Accept Android licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build with Gradle
      run: ./gradlew build --stacktrace

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Verify APK exists
      run: |
        ls -lah app/build/outputs/apk/debug/
        if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "✅ APK built successfully!"
          du -h app/build/outputs/apk/debug/app-debug.apk
        else
          echo "❌ APK not found!"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Build summary
      if: success()
      run: |
        echo "## ✅ Build Successful!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 APK Information" >> $GITHUB_STEP_SUMMARY
        echo "- File: app-debug.apk" >> $GITHUB_STEP_SUMMARY
        echo "- Size: $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Download" >> $GITHUB_STEP_SUMMARY
        echo "Download the APK from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📲 Installation" >> $GITHUB_STEP_SUMMARY
        echo "1. Download and extract the artifact ZIP" >> $GITHUB_STEP_SUMMARY
        echo "2. Transfer app-debug.apk to your Android device" >> $GITHUB_STEP_SUMMARY
        echo "3. Install the APK" >> $GITHUB_STEP_SUMMARY
        echo "4. Enable the keyboard in Settings → System → Languages & input" >> $GITHUB_STEP_SUMMARY
