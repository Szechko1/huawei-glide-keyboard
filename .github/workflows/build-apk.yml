name: Build Android APK

on:
  push:
    branches: [ main, master, develop, 'claude/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      run: |
        # Install Android SDK command-line tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        mkdir -p $HOME/android-sdk/cmdline-tools
        unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
        mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
        rm cmdline-tools.zip

        # Set environment variables
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

    - name: Install Android SDK components
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-34"
        sdkmanager "build-tools;34.0.0"
        sdkmanager "platform-tools"

    - name: Verify Android SDK
      run: |
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
        ls -la $ANDROID_HOME/platforms || echo "No platforms directory"
        ls -la $ANDROID_HOME/build-tools || echo "No build-tools directory"
        which sdkmanager

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Build release APK (unsigned)
      run: ./gradlew assembleRelease --stacktrace
      continue-on-error: true

    - name: List output files
      run: |
        echo "Checking for APK files..."
        find app/build/outputs -name "*.apk" -type f

    - name: Get APK info
      id: apk_info
      run: |
        if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "debug_size=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)" >> $GITHUB_OUTPUT
          echo "debug_exists=true" >> $GITHUB_OUTPUT
          echo "✅ Debug APK found: $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
        else
          echo "❌ Debug APK not found"
        fi
        if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
          echo "release_size=$(du -h app/build/outputs/apk/release/app-release-unsigned.apk | cut -f1)" >> $GITHUB_OUTPUT
          echo "release_exists=true" >> $GITHUB_OUTPUT
          echo "✅ Release APK found: $(du -h app/build/outputs/apk/release/app-release-unsigned.apk | cut -f1)"
        fi

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload release APK
      if: steps.apk_info.outputs.release_exists == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30

    - name: Build summary
      if: success()
      run: |
        echo "### ✅ Build Successful!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 📦 APK Files Generated:" >> $GITHUB_STEP_SUMMARY
        echo "- **Debug APK**: app-debug.apk (${{ steps.apk_info.outputs.debug_size }})" >> $GITHUB_STEP_SUMMARY
        if [ "${{ steps.apk_info.outputs.release_exists }}" == "true" ]; then
          echo "- **Release APK**: app-release-unsigned.apk (${{ steps.apk_info.outputs.release_size }})" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 📥 Download:" >> $GITHUB_STEP_SUMMARY
        echo "Go to the **Artifacts** section above to download the APK files." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 📲 Installation:" >> $GITHUB_STEP_SUMMARY
        echo "1. Download the APK from artifacts" >> $GITHUB_STEP_SUMMARY
        echo "2. Transfer to your Android device" >> $GITHUB_STEP_SUMMARY
        echo "3. Install and enable in Settings → Languages & Input → On-screen keyboard" >> $GITHUB_STEP_SUMMARY

    - name: Comment PR with build info
      if: github.event_name == 'pull_request' && success()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '### 🎉 APK Build Successful!\n\n' +
                  '✅ Debug APK is ready for download\n' +
                  '📦 Check the **Artifacts** section in the workflow run\n' +
                  '📲 Download, install on your device, and test!\n\n' +
                  '[View workflow run](' + context.payload.pull_request.html_url + '/checks)'
          })
